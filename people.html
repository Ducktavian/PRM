<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People | RELM - Personal Relationship Manager</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/people/pagination.css">
    <link rel="stylesheet" href="css/people/layout.css">
    <link rel="stylesheet" href="css/people/cards.css">
    <link rel="stylesheet" href="css/people/filters.css">
    <link rel="stylesheet" href="css/people/modal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="people-page">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="assets/relm-logo-icon.svg" alt="" width="48" height="48">
            <div class="sidebar-brand-text">
                <strong>RELM</strong>
                <span>Personal Relationship<br>Manager</span>
            </div>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
            <a href="index.html">
                <img src="assets/dashboard-icon.svg" alt="" width="18" height="18">
                Dashboard
            </a>

            <a href="people.html" aria-current="page">
                <img src="assets/people-selected-icon.svg" alt="" width="18" height="18">
                People
            </a>

            <a href="interactions.html">
                <img src="assets/interactions-icon.svg" alt="" width="18" height="18">
                Interactions
            </a>

            <a href="files.html">
                <img src="assets/files-icon.svg" alt="" width="18" height="18">
                Files
            </a>
        </nav>

        <div class="sidebar-footer">Personal Relationship<br>Manager</div>
    </aside>

    <div class="top-bar" aria-hidden="true"></div>

    <main class="main-content">
        <header class="page-header">
            <div class="header-text">
                <h1>People</h1>
                <p>Your personal and professional network.</p>
            </div>

            <a href="#add-person-modal" class="btn btn-primary" id="open-add-person-btn">
                <img src="assets/add-icon.svg" alt="" width="16" height="16">
                Add Person
            </a>
        </header>

        <section class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="Search by name, skill, interest, or location..." aria-label="Search people">
            </div>

            <div class="filter-box">
                <select aria-label="Filter by category">
                    <option value="all">All categories</option>
                    <option value="mentor">Mentor</option>
                    <option value="coworker">Coworker</option>
                    <option value="friend">Friend</option>
                    <option value="family">Family</option>
                    <option value="classmate">Classmate</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </section>

        <section class="people-grid" id="people-grid"></section>

        <nav class="pagination" aria-label="People pages">
            <output class="results-count">Showing 1-9 of 24 people</output>

            <button type="button" class="pagination-direction" data-pagination="prev">
                <img src="assets/chevron-left-icon.svg" alt="" width="16" height="16">
                Previous
            </button>

            <button type="button" class="pagination-page" data-page="1" aria-current="page">1</button>
            <button type="button" class="pagination-page" data-page="2">2</button>
            <button type="button" class="pagination-page" data-page="3">3</button>

            <button type="button" class="pagination-direction" data-pagination="next">
                Next
                <img src="assets/chevron-right-icon.svg" alt="" width="16" height="16">
            </button>
        </nav>
    </main>

    <div class="modal-overlay" id="add-person-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Person</h2>
                <a href="#" class="close-btn">&times;</a>
            </div>

            <form>
                <div class="modal-body">
                    <fieldset class="form-section">
                        <legend class="section-title">BASIC INFORMATION</legend>

                        <div class="form-group full-width">
                            <label for="add-fullname">FULL NAME *</label>
                            <input type="text" id="add-fullname" placeholder="e.g. Jordan Rivera" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="add-category">RELATIONSHIP CATEGORY *</label>
                                <select id="add-category" required>
                                    <option value="" disabled selected>Select category</option>
                                    <option value="Friend">Friend</option>
                                    <option value="Mentor">Mentor</option>
                                    <option value="Coworker">Coworker</option>
                                    <option value="Family">Family</option>
                                    <option value="Classmate">Classmate</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="add-pronouns">PRONOUNS (OPTIONAL)</label>
                                <input type="text" id="add-pronouns" placeholder="e.g. she/her, he/him, they/them">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="add-birthday">BIRTHDAY</label>
                                <input type="date" id="add-birthday">
                                <small class="sub-label">Age will be calculated automatically.</small>
                            </div>

                            <div class="form-group">
                                <label for="add-occupation">OCCUPATION OR ROLE</label>
                                <input type="text" id="add-occupation" placeholder="e.g. Designer, Engineer, Student">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="form-section">
                        <legend class="section-title">CONTACT</legend>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="add-email">EMAIL</label>
                                <input type="email" id="add-email" placeholder="email@example.com">
                            </div>

                            <div class="form-group">
                                <label for="add-phone">PHONE NUMBER</label>
                                <input type="tel" id="add-phone" placeholder="+1 (000) 000-0000">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="add-location">LOCATION</label>
                                <input type="text" id="add-location" placeholder="City, Country">
                            </div>

                            <div class="form-group">
                                <label for="add-preferred-contact">PREFERRED CONTACT METHOD</label>
                                <select id="add-preferred-contact">
                                    <option value="Email">Email</option>
                                    <option value="Phone">Phone</option>
                                    <option value="Message">Message</option>
                                </select>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="form-section">
                        <legend class="section-title">RELATIONSHIP</legend>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="add-workplace">WORKPLACE OR SCHOOL</label>
                                <input type="text" id="add-workplace" placeholder="e.g. Google, MIT">
                            </div>

                            <div class="form-group">
                                <label for="add-date-met">DATE YOU MET</label>
                                <input type="date" id="add-date-met">
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label for="add-how-met">HOW YOU MET</label>
                            <textarea id="add-how-met" placeholder="Where did you meet? What's the context?" rows="3"></textarea>
                        </div>
                    </fieldset>
                </div>

                <div class="modal-actions">
                    <a href="#" class="btn-modal-cancel">Cancel</a>
                    <button type="submit" class="btn-modal-submit">Save Person</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/people/main.js"></script>
</body>

</html>
